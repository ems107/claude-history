<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` so the page reaches under a phone's gesture bar and
         `env(safe-area-inset-*)` becomes a real number; `interactive-widget` so
         the on-screen keyboard SHRINKS the layout instead of covering it, which
         is what keeps the composer and the terminal reachable while typing. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- The SVG is the ONLY icon declared, and declaring the .ico beside it is
         what used to break the logo colour: measured in Chrome, a
         `rel="alternate icon"` with `sizes="16x16 …"` wins the tab outright —
         whatever the SVG says, `sizes="any"` and `48x48` alike — so the tinted
         tile was fetched and then never shown. `favicon.ico` has not gone
         anywhere: it sits at the conventional path, which is where a browser
         with no SVG favicon support asks for one without being told, and it is
         still the file the Start Menu shortcut points at
         (`installer/install.ps1`). `sizes="any"` says the true thing about a
         scalable icon, so anything declared here later has to beat it on
         purpose rather than by accident. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Added to a phone's home screen this opens without the browser's own bars,
         which on a 360x720 screen is two rows of the conversation back. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1115" />
    <title>Claude History</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

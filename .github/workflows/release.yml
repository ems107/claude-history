# Builds and publishes the portable win-x64 zip when a version tag is pushed.
#
#   git tag -a v1.2.0 -m "release notes..." && git push origin v1.2.0
#
# The annotated tag message becomes the release notes (--notes-from-tag),
# which the in-app updater shows in its update popup.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: node scripts/package.mjs --version "${GITHUB_REF_NAME#v}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/claude-history-*-win-x64.zip dist/checksums.txt \
            --title "$GITHUB_REF_NAME" --notes-from-tag
